name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-trixie
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: generated files are fresh
        run: |
          go generate ./...
          git diff --exit-code
      - name: gofmt
        run: test -z "$($(go env GOROOT)/bin/gofmt -l .)"
      - name: go fix
        run: test -z "$(go fix -diff ./...)"
      - run: go vet ./...
      - run: go test -race -tags testhash ./...
      - name: go test ./internal/auth (real argon2id)
        run: go test ./internal/auth

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-mode: goinstall

  ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/ts
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: 12
          runtime: node@26
          cache: true
          require-lockfile: true
          working-directory: client/ts
      - run: pnpm check
      - run: pnpm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
